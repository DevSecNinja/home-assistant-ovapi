---
name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  shared-lint:
    # v3.2.0 declares SARIF permissions even for disabled checkov/trivy jobs.
    permissions:
      contents: read
      security-events: write
    uses: DevSecNinja/.github/.github/workflows/lint.yml@eadb4f166f27d0864147189741c7596560be39dd # v3.6.0
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.11.8"
      lint-fail-on-error: true
      lint-go: false
      lint-yamllint: false
      lint-shellcheck: false
      lint-shfmt: false
      lint-checkov: false
      lint-trivy: false
      upload-sarif: false
  backend:
    name: backend (${{ matrix.runtime }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - locked
          - minimum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.11.8"
      - run: mise run install
        if: matrix.runtime == 'locked'
      - run: mise run test
        if: matrix.runtime == 'locked'
        env:
          PYTEST_ADDOPTS: --junitxml=test-results.xml
      - run: mise run test-minimum
        if: matrix.runtime == 'minimum'
        env:
          PYTEST_ADDOPTS: --junitxml=test-results.xml
      - uses: DevSecNinja/.github/actions/test-report@5452dbd33d61b4fc58b1780f57e0b60ff131be75 # v4.10.0
        if: always()
        with:
          paths: test-results.xml
          title: pytest (${{ matrix.runtime }})
      - run: mise run typecheck
        if: matrix.runtime == 'locked'
      - run: mise exec -- uv run --locked ruff check .
        if: matrix.runtime == 'locked'
      - run: mise exec -- uv run --locked ruff format --check .
        if: matrix.runtime == 'locked'
      - run: mise run package
        if: matrix.runtime == 'locked'
  hassfest:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master 2026-10-12
  hacs:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-10-12
        with:
          category: integration
          comment: false
