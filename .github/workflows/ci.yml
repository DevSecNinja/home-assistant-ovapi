---
name: CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  shared-lint:
    # v3.2.0 declares SARIF permissions even for disabled checkov/trivy jobs.
    permissions:
      contents: read
      security-events: write
    uses: DevSecNinja/.github/.github/workflows/lint.yml@24acc67adf1be33089e73b2fdbdb4be8c12d145b # v3.2.0
    with:
      mise-version: "2026.9.15"
      lint-fail-on-error: true
      lint-go: false
      lint-yamllint: false
      lint-shellcheck: false
      lint-shfmt: false
      lint-checkov: false
      lint-trivy: false
      upload-sarif: false
  backend:
    name: backend (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - locked
          - minimum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.9.15"
      - run: mise run install
        if: matrix.runtime == 'locked'
      - run: mise run test
        if: matrix.runtime == 'locked'
      - run: mise run test-minimum
        if: matrix.runtime == 'minimum'
      - run: mise run typecheck
        if: matrix.runtime == 'locked'
      - run: mise exec -- uv run --locked ruff check .
        if: matrix.runtime == 'locked'
      - run: mise exec -- uv run --locked ruff format --check .
        if: matrix.runtime == 'locked'
      - run: mise run package
        if: matrix.runtime == 'locked'
  hassfest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master 2026-10-12
  hacs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-10-12
        with:
          category: integration
          comment: false
