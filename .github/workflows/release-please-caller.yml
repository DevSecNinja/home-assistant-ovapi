---
name: Release Please

# Drives semver bumping via the central reusable workflow. On every push
# to main this opens (or updates) a `chore(main): release vX.Y.Z` PR
# with the next version's CHANGELOG bump (computed from Conventional
# Commits).
#
# Unlike consumer repos, `.github` itself does NOT have a tag-triggered
# release publishing workflow — release-please creates the GitHub
# Release directly (`skip-github-release: false`).
#
# Branch protection is fully respected: every release commit lands via
# PR through normal CI. GitHub App credentials (AUTOMATION_APP_ID /
# AUTOMATION_APP_PRIVATE_KEY, `production` environment) are mandatory; the
# "Allow GitHub Actions to create and approve pull requests" setting is not
# needed. No bypass actor required.
#
# Onboarding guide:
#   docs/release-please-onboarding.md

on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    # Self-reference pinned to the released fail-closed workflow.
    uses: DevSecNinja/.github/.github/workflows/release-please.yml@eadb4f166f27d0864147189741c7596560be39dd # v3.6.0
    permissions:
      contents: write
      pull-requests: write
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
