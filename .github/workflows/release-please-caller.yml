---
name: Release Please

# Drives semver bumping via the central reusable workflow. On every push
# to main this opens (or updates) a `chore(main): release vX.Y.Z` PR
# with the next version's CHANGELOG bump (computed from Conventional
# Commits).
#
# Unlike consumer repos, `.github` itself does NOT have a tag-triggered
# release publishing workflow — release-please creates the GitHub
# Release directly (`skip-github-release: false`).
#
# Branch protection is fully respected: every release commit lands via
# PR through normal CI. GitHub App credentials are mandatory, and the
# repository must enable "Allow GitHub Actions to create and approve pull
# requests". No bypass actor required.
#
# Onboarding guide:
#   docs/release-please-onboarding.md

on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    # Self-reference pinned to the released fail-closed workflow.
    uses: DevSecNinja/.github/.github/workflows/release-please.yml@c61e8107b080f72e25bfc41d3eef947dbfa66446 # v3.0.0
    permissions:
      contents: write
      pull-requests: write
    with:
      app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
