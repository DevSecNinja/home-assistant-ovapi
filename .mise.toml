# renovate: datasource=github-releases depName=jdx/mise
min_version = "2026.9.15"

[env]
SPECIFY_FEATURE_DIRECTORY = "specs/001-ovapi-integration"

[tools]
python = "3.14.8"
uv = "0.12.19"
dprint = "0.57.4"
yamlfmt = "0.21.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
zizmor = "1.30.1"
lefthook = "2.2.1"

[tasks.install]
run = "uv sync --frozen"

[tasks.test]
run = ["uv run pytest", "uv run python scripts/check_coverage.py"]

[tasks.lint]
run = ["uv run ruff check .", "uv run ruff format --check .", "dprint check", "yamlfmt -lint .github/workflows/*.yml custom_components/ovapi/quality_scale.yaml lefthook.yml", "actionlint", "zizmor --offline .github/workflows"]

[tasks.typecheck]
run = "uv run mypy custom_components"

[tasks.package]
run = "uv run python scripts/check_package.py"

[tasks.specify]
run = "uvx --from specify-cli==1.1.3 specify"

[tasks.check]
depends = ["test", "lint", "typecheck", "package"]
