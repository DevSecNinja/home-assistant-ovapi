# renovate: datasource=github-releases depName=jdx/mise
min_version = "2026.10.8"

[env]
SPECIFY_FEATURE_DIRECTORY = "specs/005-local-favourite-insights"

[tools]
python = "3.14.8"
uv = "0.13.0"
dprint = "0.63.0"
yamlfmt = "0.21.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
zizmor = "1.30.1"
lefthook = "2.2.2"

[tasks.install]
run = "uv sync --locked"

[tasks.test]
run = ["uv run --locked python scripts/check_compatibility.py dev", "uv run --locked pytest", "uv run --locked python scripts/check_coverage.py"]

[tasks.test-minimum]
env = { UV_PROJECT_ENVIRONMENT = ".venv-minimum", COVERAGE_FILE = ".coverage-minimum" }
run = [
  "uv sync --locked --only-group minimum",
  "uv run --locked --only-group minimum python scripts/check_compatibility.py minimum",
  "uv run --locked --only-group minimum pytest --cov-report=json:coverage-minimum.json",
  "uv run --locked --only-group minimum python scripts/check_coverage.py coverage-minimum.json",
]

[tasks.lint]
run = ["uv run --locked ruff check .", "uv run --locked ruff format --check .", "dprint check", "yamlfmt -lint .github/actionlint.yaml .github/workflows/*.yml custom_components/ovapi/quality_scale.yaml lefthook.yml", "actionlint", "zizmor --offline .github/workflows"]

[tasks.typecheck]
run = "uv run --locked mypy custom_components"

[tasks.test-ui]
env = { OVAPI_UI_ARTIFACTS = ".ha-e2e/evidence" }
run = "uv run --locked --group e2e pytest tests/ui/test_native_picker.py -m frontend --no-cov --timeout=60"

[tasks.package]
run = "uv run --locked python -m scripts.check_package"

[tasks.specify]
run = "uvx --from specify-cli==1.1.3 specify"

[tasks.check]
depends = ["test", "test-minimum", "lint", "typecheck", "package"]
