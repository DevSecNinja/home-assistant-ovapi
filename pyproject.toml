[project]
name = "home-assistant-ovapi"
version = "0.1.0"
description = "Retention-safe, shared-budget OVAPI integration for Home Assistant"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.372",
  "mypy>=1.18",
  "ruff>=0.14",
]
# This fixture's own HA pin must equal hacs.json's declared minimum.
# Update deliberately with the supported floor, not with routine dev updates.
minimum = ["pytest-homeassistant-custom-component==0.13.371"]
e2e = ["home-assistant-frontend==20260930.3", "playwright==1.56.0"]

[tool.uv]
conflicts = [[{ group = "dev" }, { group = "minimum" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not frontend' --disable-socket --allow-unix-socket --cov=custom_components.ovapi --cov-branch --cov-report=term-missing --cov-report=json:coverage.json"
markers = ["frontend: optional actual HA frontend browser evidence (requires e2e group)"]

[tool.coverage.run]
source = ["custom_components.ovapi"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".specify", ".github/skills", ".venv-minimum"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
follow_imports = "silent"
